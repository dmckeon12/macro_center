tags:
  - name: Auth
    description: Authentication operations
  - name: Users
    description: User operations
  - name: Products
    description: Product operations
  - name: Orders
    description: Order operations
  - name: Reviews
    description: Review operations
  - name: Payments
    description: Payment operations

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                phone:
                  type: string
      responses:
        "201":
          description: User created successfully
        "400":
          description: Invalid request

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials

  /products:
    get:
      tags:
        - Products
      summary: Get all products
      description: Retrieve all products with filtering, sorting, and pagination
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category
        - in: query
          name: brand_name
          schema:
            type: string
          description: Filter by brand name
        - in: query
          name: min_price
          schema:
            type: integer
          description: Minimum price in cents
        - in: query
          name: max_price
          schema:
            type: integer
          description: Maximum price in cents
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [price_asc, price_desc, newest, rating]
          description: Sort products
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search query
      responses:
        "200":
          description: List of products
    
    post:
      tags:
        - Products
      summary: Create a product
      description: Create a new product (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - brand_name
                - name
                - details
                - price_cents
                - specs
                - main_picture_url
                - description
              properties:
                category:
                  type: string
                  enum: [cpu, gpu, motherboard, ram, storage, psu]
                brand_name:
                  type: string
                name:
                  type: string
                details:
                  type: string
                price_cents:
                  type: integer
                status:
                  type: string
                  enum: [active, inactive, discontinued]
                  default: active
                specs:
                  type: object
                stock:
                  type: boolean
                  default: true
                quantity:
                  type: integer
                  default: 100
                main_picture_url:
                  type: string
                additional_images:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                discount_percent:
                  type: number
                  default: 0
                featured:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Product created successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access required

  /orders:
    get:
      tags:
        - Orders
      summary: Get all orders (Admin only)
      description: Retrieve all orders with filtering and pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
          description: Filter by status
        - in: query
          name: isPaid
          schema:
            type: boolean
          description: Filter by payment status
        - in: query
          name: isDelivered
          schema:
            type: boolean
          description: Filter by delivery status
      responses:
        "200":
          description: List of orders
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - Admin access required
    
    post:
      tags:
        - Orders
      summary: Create an order
      description: Create a new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderItems
                - shippingAddress
                - paymentMethod
                - itemsPrice_cents
                - shippingPrice_cents
                - taxPrice_cents
                - totalPrice_cents
              properties:
                orderItems:
                  type: array
                  items:
                    type: object
                    required:
                      - product
                      - name
                      - qty
                      - price_cents
                      - main_picture_url
                    properties:
                      product:
                        type: string
                      name:
                        type: string
                      qty:
                        type: integer
                        minimum: 1
                      price_cents:
                        type: integer
                      main_picture_url:
                        type: string
                shippingAddress:
                  type: object
                  required:
                    - fullName
                    - street
                    - city
                    - state
                    - zipCode
                  properties:
                    fullName:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    zipCode:
                      type: string
                    country:
                      type: string
                      default: "United States"
                    phone:
                      type: string
                paymentMethod:
                  type: string
                  enum: [credit_card, paypal, stripe]
                itemsPrice_cents:
                  type: integer
                shippingPrice_cents:
                  type: integer
                taxPrice_cents:
                  type: integer
                totalPrice_cents:
                  type: integer
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized

  /payments/create-payment-intent:
    post:
      tags:
        - Payments
      summary: Create payment intent
      description: Create a Stripe payment intent for an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: string
      responses:
        "200":
          description: Payment intent created successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: Order not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
